[package]
name    = "sentinelops-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic          = { version = "0.12", features = ["tls"] }
prost          = "0.13"
tokio          = { version = "1", features = ["full"] }
tokio-stream   = "0.1"
anyhow         = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid           = { version = "1", features = ["v4"] }
chrono         = "0.4"
hostname       = "0.4"
dotenvy        = "0.15"

[build-dependencies]
tonic-build = "0.12"
